<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Kick Streamers & Prediction Market</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg-base: #0e0f13; --bg-nav: #0a0b0e; --bg-card: #161820; --green: #53fc18; --text-primary: #f0f0f0; --text-secondary: #9a9ba8; --border: #2a2c3a; --polymarket-blue: #004bff; --yes-green: #00aa6c; --no-red: #eb3d3d; --radius-md: 10px; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
    nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--bg-nav); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 100; }
    .layout { display: flex; padding-top: 60px; min-height: 100vh; }
    aside { width: 240px; position: fixed; top: 60px; bottom: 0; background: var(--bg-nav); border-right: 1px solid var(--border); padding: 20px 0; overflow-y: auto; }
    main, #portfolio-view, #player-view { flex: 1; margin-left: 240px; padding: 28px; display: none; }
    main.active, #portfolio-view.active, #player-view.active { display: block !important; }
    
    /* Market Timeline */
    .pm-chrono-bar-container { display: flex; align-items: center; gap: 8px; background: #111217; padding: 8px; border: 1px solid var(--border); border-radius: 8px; margin-top: 12px; }
    .pm-timeline-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
    .pm-timeline-tab.active { background: var(--polymarket-blue); border-color: var(--polymarket-blue); color: #fff; }
    .pm-timeline-tab.live { background: rgba(0, 75, 255, 0.1); color: #6fb2ff; }

    /* UI Elements */
    .card { background: var(--bg-card); padding: 20px; border-radius: 12px; cursor: pointer; }
    .portfolio-data-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; padding: 16px; border-bottom: 1px solid var(--border); align-items: center; }
    .claim-btn { background: var(--yes-green); color: #0a0b0e; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c1e28; padding: 10px 20px; border-radius: 20px; display: none; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="showMain()"><b>MyKick</b></div>
  <div class="nav-right-actions" style="margin-left:auto;">
    <button class="nav-portfolio-btn" onclick="openPortfolioView()">My Bets</button>
    <button class="nav-wallet-btn" onclick="connectWallet()"><span id="wallet-btn-text">Connect Wallet</span></button>
  </div>
</nav>

<div class="layout">
  <aside id="sidebar"></aside>

  <main id="main-view" class="active">
    <div class="grid" id="grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:20px;"></div>
  </main>

  <div id="portfolio-view">
    <h1>Your Positions</h1>
    <div id="portfolio-rows-injector" class="portfolio-table-wrap"></div>
  </div>

  <div id="player-view">
    <div class="player-topbar">
      <h2 id="player-name"></h2>
      <div class="pm-chrono-bar-container" id="pm-dynamic-tabs-lane"></div>
    </div>
    <div class="player-main-content">
      <iframe id="player-iframe" style="width:100%; aspect-ratio:16/9;"></iframe>
      <div id="market-buckets-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let streamers = [{username: 'haddzy', display: 'Haddzy'}, {username: 'classybeef', display: 'ClassyBeef'}];
  let globalMarketRegistry = JSON.parse(localStorage.getItem('mykick_registry') || '[]');
  let activeBetPositionsArray = JSON.parse(localStorage.getItem('mykick_bets') || '[]');
  let currentPlayer = null;

  // Initialize Markets
  function initRegistry() {
    let now = Math.floor(Date.now() / 1000);
    let hour = Math.floor(now / 3600) * 3600;
    if(globalMarketRegistry.length === 0) {
        globalMarketRegistry.push({endTime: hour, displayTime: 'Live', isResolved: false});
    }
  }

  function showMain() {
    document.getElementById('main-view').className = 'active';
    document.getElementById('player-view').className = '';
    document.getElementById('portfolio-view').className = '';
  }

  function openPortfolioView() {
    document.getElementById('main-view').className = '';
    document.getElementById('player-view').className = '';
    document.getElementById('portfolio-view').className = 'active';
    renderPortfolio();
  }

  function renderPortfolio() {
    const container = document.getElementById('portfolio-rows-injector');
    container.innerHTML = activeBetPositionsArray.map((p, i) => `
      <div class="portfolio-data-row">
        <span>${p.streamer}</span>
        <span>${p.bracketLabel}</span>
        <span>${p.shares}</span>
        <span>${Math.floor(Date.now()/1000) > p.endTime ? 'Resolved' : 'Active'}</span>
        <button class="claim-btn" onclick="toast('Claiming...')">Claim</button>
      </div>`).join('');
  }

  function openPlayer(u) {
    currentPlayer = u;
    document.getElementById('main-view').className = '';
    document.getElementById('player-view').className = 'active';
    document.getElementById('player-name').textContent = u;
    document.getElementById('player-iframe').src = `https://player.kick.com/${u}`;
    rebuildTimeline();
  }

  function rebuildTimeline() {
    const lane = document.getElementById('pm-dynamic-tabs-lane');
    lane.innerHTML = globalMarketRegistry.map(m => `<div class="pm-timeline-tab ${m.isResolved ? 'historical':'live'}">${m.displayTime}</div>`).join('');
  }

  function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

  initRegistry();
  document.getElementById('grid').innerHTML = streamers.map(s => `<div class="card" onclick="openPlayer('${s.username}')"><div class="card-thumb">LIVE</div><div class="card-body">${s.display}</div></div>`).join('');
</script>
</body>
</html>
