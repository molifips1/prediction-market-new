<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Kick Streamers & Prediction Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #0e0f13;
      --bg-nav: #0a0b0e;
      --bg-card: #161820;
      --bg-card-hover: #1c1e28;
      --bg-input: #1c1e28;
      --bg-modal: #1c1e28;
      --green: #53fc18;
      --green-dim: rgba(83,252,24,0.15);
      --green-text: #3dd400;
      --text-primary: #f0f0f0;
      --text-secondary: #9a9ba8;
      --text-muted: #5c5d6e;
      --border: #2a2c3a;
      --border-hover: #3a3c4e;
      --live-red: #eb3d3d;
      --polygon-purple: #8247e5;
      --polygon-purple-hover: #6f36ca;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --nav-h: 60px;
      --sidebar-w: 240px;
      --yes-green: #00aa6c;
      --no-red: #eb3d3d;
      --polymarket-blue: #004bff;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h);
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 16px;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; cursor: pointer; }
    .nav-logo-icon { width: 34px; height: 34px; background: var(--green); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
    .nav-logo-icon svg { width: 18px; height: 18px; }
    .nav-logo-text { font-size: 18px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }
    .nav-search { flex: 1; max-width: 500px; margin: 0 auto; position: relative; }
    .nav-search input {
      width: 100%; height: 36px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 20px; padding: 0 40px 0 16px;
      color: var(--text-primary); font-family: inherit; font-size: 13px;
      outline: none; transition: border-color .2s;
    }
    .nav-search input:focus { border-color: var(--green); }
    .nav-search input::placeholder { color: var(--text-muted); }
    .nav-search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    .nav-wallet-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--polygon-purple); color: #ffffff;
      border: none; border-radius: var(--radius-sm);
      padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .15s; flex-shrink: 0;
    }
    .nav-wallet-btn:hover { background: var(--polygon-purple-hover); }
    .nav-wallet-btn svg { width: 16px; height: 16px; }

    /* LAYOUT */
    .layout { display: flex; padding-top: var(--nav-h); min-height: 100vh; }

    /* SIDEBAR */
    aside {
      width: var(--sidebar-w); flex-shrink: 0;
      position: fixed; top: var(--nav-h); bottom: 0; left: 0;
      background: var(--bg-nav); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 20px 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 8px 20px 4px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 20px; cursor: pointer;
      color: var(--text-secondary); font-size: 14px; font-weight: 500;
      text-decoration: none; transition: background .15s, color .15s; position: relative;
    }
    .sidebar-item:hover { background: rgba(255,255,255,.04); color: var(--text-primary); }
    .sidebar-item.active { color: var(--text-primary); background: rgba(255,255,255,.04); }
    .sidebar-item.active::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--green); border-radius: 0 3px 3px 0; }
    .sidebar-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-secondary); overflow: hidden; flex-shrink: 0; }
    .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live-red); margin-left: auto; flex-shrink: 0; box-shadow: 0 0 6px var(--live-red); }
    .live-dot.hidden { opacity: 0; }
    .sidebar-viewers { font-size: 11px; color: var(--text-muted); margin-left: auto; }

    /* MAIN — browse view */
    main { flex: 1; margin-left: var(--sidebar-w); padding: 28px 28px 40px; min-width: 0; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .page-title span { color: var(--green); }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; }
    .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .filter-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .filter-btn.active { background: var(--green); border-color: var(--green); color: #0a0b0e; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    /* CARDS */
    .card { background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: background .2s, transform .15s; border: 1px solid transparent; }
    .card:hover { background: var(--bg-card-hover); border-color: var(--border); transform: translateY(-2px); }
    .card-thumb { position: relative; aspect-ratio: 16/9; background: #111318; overflow: hidden; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111318; }
    .thumb-placeholder svg { width: 40px; height: 40px; opacity: .18; }
    .card-badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em; padding: 3px 8px; border-radius: 4px; }
    .badge-live { background: var(--live-red); color: #fff; }
    .badge-offline { background: rgba(0,0,0,.6); color: #999; }
    .card-viewers { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
    .card-viewers svg { width: 12px; height: 12px; }
    .card-hover-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0); transition: background .2s; }
    .card:hover .card-hover-overlay { background: rgba(0,0,0,.35); }
    .play-circle { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.85); transition: opacity .2s, transform .2s; }
    .card:hover .play-circle { opacity: 1; transform: scale(1); }
    .play-circle svg { width: 22px; height: 22px; margin-left: 3px; }
    .card-body { padding: 12px 14px 14px; }
    .card-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .card-avatar { width: 38px; height: 38px; border-radius: 50%; background: #252738; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; overflow: hidden; }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title { font-size: 12px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-category { font-size: 12px; color: var(--text-muted); }

    /* POLYMARKET PARADIGM SPLIT PLATFORM */
    #player-view {
      display: none;
      flex: 1;
      margin-left: var(--sidebar-w);
      flex-direction: column;
      min-width: 0;
    }
    #player-view.active { display: flex; }
    main.hidden { display: none; }

    .player-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-nav);
      flex-shrink: 0;
    }
    .player-back {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-secondary);
      font-family: inherit; font-size: 13px; padding: 6px 12px;
      cursor: pointer; transition: all .15s;
    }
    .player-back:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .player-back svg { width: 14px; height: 14px; }
    .player-streamer-name { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
    .player-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--live-red); color: #fff; }
    .player-viewers { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .player-viewers svg { width: 13px; height: 13px; }
    .player-kick-link {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--green-text);
      text-decoration: none; padding: 6px 12px;
      border: 1px solid rgba(83,252,24,.2); background: var(--green-dim);
      border-radius: var(--radius-sm); transition: all .15s;
    }
    .player-kick-link:hover { background: rgba(83,252,24,.25); border-color: rgba(83,252,24,.4); }
    .player-kick-link svg { width: 12px; height: 12px; }

    /* POLYMARKET CORE CONTENT STRUCTURE */
    .player-main-content {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 24px;
      align-items: flex-start;
    }
    
    /* LEFT SIDE: MAIN STAGE STREAM + BRACKETS LIST */
    .player-left-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }
    .player-iframe-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .player-iframe-wrap iframe {
      width: 100%; height: 100%;
      border: none; display: block;
    }
    .player-blocked {
      display: none;
      position: absolute; inset: 0;
      background: #0a0b0e;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px;
    }
    .player-blocked.show { display: flex; }
    .player-blocked svg { width: 48px; height: 48px; opacity: .25; }
    .player-blocked p { font-size: 15px; color: var(--text-secondary); }
    .player-blocked a {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green); color: #0a0b0e;
      font-weight: 600; font-size: 13px; padding: 9px 18px;
      border-radius: var(--radius-sm); text-decoration: none;
      transition: opacity .15s;
    }
    .player-blocked a:hover { opacity: .88; }

    .player-info-bar {
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .player-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: var(--text-primary); }
    .player-category { font-size: 13px; color: var(--text-muted); }

    /* STACKED LIST BRACKETS */
    .market-section-header {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .market-buckets-list-wrapper {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .bucket-row-item {
      display: grid;
      grid-template-columns: 1fr 140px 100px 100px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      transition: background 0.15s;
    }
    .bucket-row-item:last-child { border-bottom: none; }
    .bucket-row-item.selected { background: rgba(0, 75, 255, 0.04); }
    
    .bucket-row-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .bucket-row-volume {
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
    }
    .row-bet-btn {
      border: none;
      border-radius: var(--radius-sm);
      height: 38px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-bet-btn:hover { opacity: 0.88; }
    .row-bet-btn.yes {
      background: rgba(0, 170, 108, 0.1);
      border: 1px solid var(--yes-green);
      color: #00dd8d;
    }
    .row-bet-btn.yes.active {
      background: var(--yes-green);
      color: #0a0b0e;
    }
    .row-bet-btn.no {
      background: rgba(235, 61, 61, 0.1);
      border: 1px solid var(--no-red);
      color: #ff6b6b;
    }
    .row-bet-btn.no.active {
      background: var(--no-red);
      color: white;
    }

    /* RIGHT SIDE: FIX-ANCHORED TRADING ORDER SLIP BOX */
    .market-right-sticky-panel {
      position: sticky;
      top: calc(var(--nav-h) + 24px);
    }
    .order-slip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .order-market-title-heading {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .order-slip-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-base);
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    .order-tab {
      border: none;
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .order-tab.yes-active {
      background: var(--yes-green);
      color: #0a0b0e;
    }
    .order-tab.no-active {
      background: var(--no-red);
      color: white;
    }
    .order-tab.inactive {
      background: transparent;
      color: var(--text-muted);
    }
    .order-slip-sub-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .order-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }
    .order-input-container input {
      width: 100%;
      height: 52px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 65px 0 16px;
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 600;
      outline: none;
      font-family: inherit;
    }
    .order-input-container input:focus {
      border-color: var(--polymarket-blue);
    }
    .order-currency-label {
      position: absolute;
      right: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .order-quick-amounts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .quick-amt-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 0;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .quick-amt-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }
    .order-summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .order-summary-value {
      font-weight: 600;
      color: var(--text-primary);
    }
    .trade-submit-btn {
      width: 100%;
      height: 46px;
      background: var(--polymarket-blue);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .trade-submit-btn:hover { opacity: 0.9; }
    
    .order-empty-state {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 10px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }

    /* EMPTY */
    .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty svg { width: 48px; height: 48px; opacity: .3; display: block; margin: 0 auto 14px; }
    .empty p { font-size: 15px; margin-bottom: 6px; color: var(--text-secondary); }
    .empty small { font-size: 13px; }

    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.8} }
    .card.loading { pointer-events: none; animation: pulse 1.4s ease-in-out infinite; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1c1e28; border: 1px solid var(--border); color: var(--text-primary); font-size: 13px; padding: 10px 20px; border-radius: 20px; z-index: 300; transition: transform .3s ease; pointer-events: none; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 1024px) {
      .player-main-content { grid-template-columns: 1fr; }
      .market-right-sticky-panel { position: static; width: 100%; }
    }
    @media (max-width: 700px) {
      aside { display: none; }
      main, #player-view { margin-left: 0; padding: 16px; }
      .nav-search { max-width: 180px; }
      .player-topbar { padding: 10px 12px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="goHome()">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
    <span class="nav-logo-text">MyKick</span>
  </div>
  <div class="nav-search">
    <input type="text" id="search-input" placeholder="Search streamers…" oninput="handleSearch()" />
    <span class="nav-search-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
  </div>
  <button id="wallet-btn" class="nav-wallet-btn" onclick="connectWallet()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3"/></svg>
    <span id="wallet-btn-text">Connect Wallet</span>
  </button>
</nav>

<div class="layout">
  <aside id="sidebar"></aside>

  <main id="main-view">
    <div class="page-header">
      <h1 class="page-title">Following <span id="live-count"></span></h1>
    </div>
    <div class="filter-bar">
      <button class="filter-btn" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn active" onclick="setFilter('live', this)">Live</button>
      <button class="filter-btn" onclick="setFilter('offline', this)">Offline</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <div id="player-view">
    <div class="player-topbar">
      <button class="player-back" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back
      </button>
      <span class="player-streamer-name" id="player-name"></span>
      <span class="player-badge" id="player-live-badge" style="display:none">LIVE</span>
      <span class="player-viewers" id="player-viewers" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="player-viewers-count"></span>
      </span>
      <a class="player-kick-link" id="player-kick-link" href="#" target="_blank">
        Watch on Kick
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
      </a>
    </div>
    
    <div class="player-main-content">
      <div class="player-left-panel">
        <div class="player-iframe-wrap">
          <iframe id="player-iframe" allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
          <div class="player-blocked" id="player-blocked">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" x2="19.07" y1="4.93" y2="19.07"/></svg>
            <p>Kick is blocking the embed for this stream.<br/>Watch it directly on Kick instead.</p>
            <a id="blocked-link" href="#" target="_blank">Open on Kick</a>
          </div>
        </div>
        
        <div class="player-info-bar">
          <div class="player-title" id="player-title"></div>
          <div class="player-category" id="player-category"></div>
        </div>

        <div>
          <div class="market-section-header">Predict Viewer Brackets</div>
          <div class="market-buckets-list-wrapper" id="market-buckets-list">
            </div>
        </div>
      </div>

      <div class="market-right-sticky-panel">
        <div id="order-slip-container">
          <div class="order-slip-card">
            <span class="order-market-title-heading">Viewer Bracket Order Slip</span>
            <div class="order-empty-state">
              Select a bracket YES or NO option below the stream to prepare your trade.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const KICK = 'https://kick.com/';
  const WORKER_URL = 'https://blue-unit-891d.apetersen280.workers.dev/';
  
  const POLYGON_CHAIN_ID = '0x137'; 

  let streamers = JSON.parse(localStorage.getItem('mykick_streamers') || 'null') || [
    { username: 'haddzy',       display: 'Haddzy' },
    { username: 'trainwreckstv', display: 'Trainwreckstv' },
    { username: 'sweetflips',       display: 'SweetFlips' },
    { username: 'classybeef',       display: 'ClassyBeef' },
    { username: 'thedoctor',       display: 'TheDoctor' },
    { username: 'auslots',       display: 'auslots' },
    { username: 'generalqw77',       display: 'generalqw77' },
    { username: 'roshtein',       display: 'roshtein' },
    { username: 'maherco',       display: 'maherco' },
    { username: 'kyootbot',      display: 'Kyootbot' }
  ];
  let data = {};
  let filter = 'live';
  let searchQ = '';
  let currentPlayer = null;
  let userWalletAddress = null;
  let activeMarketSelection = null;

  function save() { localStorage.setItem('mykick_streamers', JSON.stringify(streamers)); }

  /* WEB3 CONNECTIONS */
  async function connectWallet() {
    if (!window.ethereum) {
      toast("Please install MetaMask or a compatible Web3 Wallet!");
      return;
    }
    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await provider.send("eth_requestAccounts", []);
      userWalletAddress = accounts[0];
      
      const network = await provider.getNetwork();
      if (network.chainId !== 137n) {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: POLYGON_CHAIN_ID }],
          });
        } catch (switchError) {
          if (switchError.code === 4902) {
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: POLYGON_CHAIN_ID,
                chainName: 'Polygon Mainnet',
                nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
                rpcUrls: ['https://polygon-rpc.com/'],
                blockExplorerUrls: ['https://polygonscan.com/']
              }],
            });
          }
        }
      }
      
      updateWalletUI();
      if (activeMarketSelection) {
        selectBetSlip(activeMarketSelection.bucketId, activeMarketSelection.label, activeMarketSelection.outcome, activeMarketSelection.pricePerShare);
      }
      toast("Wallet Connected to Polygon!");
    } catch (err) {
      console.error(err);
      toast("Connection Failed.");
    }
  }

  function updateWalletUI() {
    const btnText = document.getElementById('wallet-btn-text');
    if (userWalletAddress) {
      btnText.textContent = `${userWalletAddress.slice(0, 6)}...${userWalletAddress.slice(-4)}`;
    } else {
      btnText.textContent = "Connect Wallet";
    }
  }

  if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
      userWalletAddress = accounts.length > 0 ? accounts[0] : null;
      updateWalletUI();
      if (activeMarketSelection) {
        selectBetSlip(activeMarketSelection.bucketId, activeMarketSelection.label, activeMarketSelection.outcome, activeMarketSelection.pricePerShare);
      }
    });
    window.ethereum.on('chainChanged', () => window.location.reload());
  }

  /* RE-RENDER STACKED LIST BRACKETS SUB-STREAM PANEL */
  function loadMarketLayout(username) {
    const container = document.getElementById('market-buckets-list');
    const streamInfo = data[username];
    
    activeMarketSelection = null;
    resetOrderSlipDefault();

    const baseCount = streamInfo?.viewers || 1500;
    
    const brackets = [
      { id: 'b1', label: `Under ${fv(Math.round(baseCount * 0.7))}` },
      { id: 'b2', label: `${fv(Math.round(baseCount * 0.7))} – ${fv(Math.round(baseCount * 1.1))}` },
      { id: 'b3', label: `${fv(Math.round(baseCount * 1.1))} – ${fv(Math.round(baseCount * 1.5))}` },
      { id: 'b4', label: `Over ${fv(Math.round(baseCount * 1.5))}` }
    ];

    container.innerHTML = brackets.map((b) => {
      const yesPrice = 50; 
      const noPrice = 50;

      return `
        <div class="bucket-row-item" id="card-${b.id}">
          <span class="bucket-row-title">${b.label}</span>
          <span class="bucket-row-volume">Volume: $0.00</span>
          <button class="row-bet-btn yes" id="btn-yes-${b.id}" onclick="selectBetSlip('${b.id}', '${b.label}', 'YES', ${yesPrice})">
            Yes ¢${yesPrice}
          </button>
          <button class="row-bet-btn no" id="btn-no-${b.id}" onclick="selectBetSlip('${b.id}', '${b.label}', 'NO', ${noPrice})">
            No ¢${noPrice}
          </button>
        </div>
      `;
    }).join('');
  }

  function resetOrderSlipDefault() {
    const slipContainer = document.getElementById('order-slip-container');
    slipContainer.innerHTML = `
      <div class="order-slip-card">
        <span class="order-market-title-heading">Viewer Bracket Order Slip</span>
        <div class="order-empty-state">
          Select a bracket YES or NO option below the stream to prepare your trade.
        </div>
      </div>
    `;
  }

  /* INJECT SELECTION INTO RIGHT-SIDE POLYMARKET MODAL */
  function selectBetSlip(bucketId, label, outcome, pricePerShare) {
    activeMarketSelection = { bucketId, label, outcome, pricePerShare };

    document.querySelectorAll('.bucket-row-item').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.row-bet-btn').forEach(el => el.classList.remove('active'));

    document.getElementById(`card-${bucketId}`).classList.add('selected');
    if (outcome === 'YES') {
      document.getElementById(`btn-yes-${bucketId}`).classList.add('active');
    } else {
      document.getElementById(`btn-no-${bucketId}`).classList.add('active');
    }

    const slipContainer = document.getElementById('order-slip-container');
    slipContainer.innerHTML = `
      <div class="order-slip-card">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span class="order-slip-sub-label">Market Option</span>
          <span class="order-market-title-heading">${label}</span>
        </div>
        
        <div class="order-slip-tabs">
          <button class="order-tab ${outcome === 'YES' ? 'yes-active' : 'inactive'}" onclick="selectBetSlip('${bucketId}', '${label}', 'YES', 50)">Buy Yes</button>
          <button class="order-tab ${outcome === 'NO' ? 'no-active' : 'inactive'}" onclick="selectBetSlip('${bucketId}', '${label}', 'NO', 50)">Buy No</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
          <span class="order-slip-sub-label">Amount</span>
          <div class="order-input-container">
            <input type="number" id="order-amount-input" value="10" min="1" placeholder="0" oninput="calculateShares()">
            <span class="order-currency-label">USDC</span>
          </div>
        </div>

        <div class="order-quick-amounts">
          <button class="quick-amt-btn" onclick="addOrderAmount(1)">+$1</button>
          <button class="quick-amt-btn" onclick="addOrderAmount(5)">+$5</button>
          <button class="quick-amt-btn" onclick="addOrderAmount(10)">+$10</button>
          <button class="quick-amt-btn" onclick="addOrderAmount(100)">+$100</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px; padding-top:12px; border-top:1px solid var(--border);">
          <div class="order-summary-row">
            <span>Avg. Price</span>
            <span class="order-summary-value">¢${pricePerShare}</span>
          </div>
          <div class="order-summary-row">
            <span>Est. Shares Received</span>
            <span class="order-summary-value" id="est-shares-val">20.00</span>
          </div>
        </div>

        <button class="trade-submit-btn" onclick="submitFinalBet()">
          ${userWalletAddress ? 'Submit Trade' : 'Connect Wallet to Trade'}
        </button>
      </div>
    `;
    calculateShares();
  }

  function addOrderAmount(val) {
    const input = document.getElementById('order-amount-input');
    if (!input) return;
    const current = parseFloat(input.value) || 0;
    input.value = current + val;
    calculateShares();
  }

  function calculateShares() {
    if (!activeMarketSelection) return;
    const inputEl = document.getElementById('order-amount-input');
    const usdAmount = inputEl ? (parseFloat(inputEl.value) || 0) : 0;
    const priceCents = activeMarketSelection.pricePerShare;
    
    const totalShares = usdAmount / (priceCents / 100);
    const displayVal = document.getElementById('est-shares-val');
    if (displayVal) displayVal.textContent = totalShares.toFixed(2);
  }

  function submitFinalBet() {
    if (!userWalletAddress) {
      connectWallet();
      return;
    }
    const usdAmount = parseFloat(document.getElementById('order-amount-input').value) || 0;
    if (usdAmount <= 0) {
      toast("Please enter a valid investment amount!");
      return;
    }
    toast(`Routing contract approval: Depositing $${usdAmount.toFixed(2)} USDC on ${activeMarketSelection.outcome} shares.`);
  }

  /* FETCH */
  async function fetchOne(username) {
    try {
      const r = await fetch(`${WORKER_URL}?user=${encodeURIComponent(username)}`);
      if (!r.ok) throw new Error('Proxy error');
      
      const d = await r.json();
      if (!d || d.message) return null;
      
      return {
        isLive: !!d.livestream,
        title: d.livestream?.session_title || '',
        viewers: d.livestream?.viewer_count || 0,
        category: d.livestream?.categories?.[0]?.name || d.recent_categories?.[0]?.name || '',
        thumbnail: d.livestream?.thumbnail?.url || null,
        avatar: d.user?.profile_pic || null,
        displayName: d.user?.username || username,
      };
    } catch (e) {
      console.error(`Failed to fetch ${username}:`, e);
      return null;
    }
  }

  async function loadAll() {
    render();
    await Promise.all(streamers.map(async s => {
      data[s.username] = await fetchOne(s.username);
      render();
      if (currentPlayer === s.username) {
        updatePlayerMeta(s.username);
        if (!activeMarketSelection) loadMarketLayout(s.username);
      }
    }));
  }

  /* FORMAT */
  function fv(n) { return n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'K' : String(n); }
  function initials(name) { return name.slice(0,2).toUpperCase(); }

  /* RENDER */
  function render() { renderGrid(); renderSidebar(); renderLiveCount(); }

  function visible(s) {
    const d = data[s.username];
    const matchFilter = filter === 'all' || (filter === 'live' && d?.isLive) || (filter === 'offline' && !d?.isLive);
    const matchSearch = !searchQ || s.username.includes(searchQ) || (d?.displayName || '').toLowerCase().includes(searchQ);
    return matchFilter && matchSearch;
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const shown = streamers.filter(visible);
    if (shown.length === 0) {
      const isEmpty = streamers.length === 0;
      grid.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>${isEmpty ? "You're not following anyone yet" : "No streamers match your filter"}</p>
        <small>${isEmpty ? 'Try a different filter' : ''}</small>
      </div>`;
      return;
    }
    grid.innerHTML = shown.map(s => cardHTML(s)).join('');
  }

  function cardHTML(s) {
    const d = data[s.username];
    const loading = !d;
    const isLive = d?.isLive;
    const name = d?.displayName || s.display;
    const ini = initials(name);
    return `<div class="card${loading ? ' loading' : ''}" data-user="${s.username}" onclick="openPlayer('${s.username}')">
      <div class="card-thumb">
        ${d?.thumbnail
          ? `<img src="${d.thumbnail}" alt="" onerror="this.parentNode.innerHTML='<div class=thumb-placeholder><svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'1.5\'><path d=\'M15 10l4.553-2.069A1 1 0 0 1 21 8.82v6.36a1 1 0 0 1-1.447.89L15 14M3 8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z\'/></svg></div>'" />`
          : `<div class="thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.82v6.36a1 1 0 0 1-1.447.89L15 14M3 8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg></div>`}
        <span class="card-badge ${isLive ? 'badge-live' : 'badge-offline'}">${isLive ? 'LIVE' : 'OFFLINE'}</span>
        ${isLive ? `<div class="card-viewers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${fv(d.viewers)}</div>` : ''}
        <div class="card-hover-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24" fill="#0a0b0e"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-avatar">
            ${d?.avatar ? `<img src="${d.avatar}" alt="${name}" onerror="this.style.display='none';this.parentNode.innerText='${ini}'"/>` : ini}
          </div>
          <div class="card-info">
            <div class="card-name">${name}</div>
            <div class="card-title">${d?.title || (isLive ? 'Streaming now' : 'Currently offline')}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="card-category">${d?.category || ''}</div>
        </div>
      </div>
    </div>`;
  }

  function renderSidebar() {
    const sb = document.getElementById('sidebar');
    const sorted = [...streamers].sort((a, b) => (data[b.username]?.isLive ? 1 : 0) - (data[a.username]?.isLive ? 1 : 0));
    sb.innerHTML = `<div class="sidebar-section-label">Following</div>` +
      sorted.map(s => {
        const d = data[s.username];
        const isLive = d?.isLive;
        const name = d?.displayName || s.display;
        const ini = initials(name);
        const isActive = currentPlayer === s.username;
        return `<div class="sidebar-item${isActive ? ' active' : ''}" onclick="openPlayer('${s.username}')">
          <div class="sidebar-avatar">
            ${d?.avatar ? `<img src="${d.avatar}" alt="${name}" onerror="this.style.display='none';this.parentNode.innerText='${ini}'"/>` : ini}
          </div>
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">${name}</span>
          ${isLive ? `<span class="sidebar-viewers">${fv(d.viewers)}</span><span class="live-dot"></span>` : `<span class="live-dot hidden"></span>`}
        </div>`;
      }).join('');
  }

  function renderLiveCount() {
    const live = streamers.filter(s => data[s.username]?.isLive).length;
    const el = document.getElementById('live-count');
    if (live > 0) { el.textContent = `— ${live} Live`; el.style.color = '#eb3d3d'; }
    else { el.textContent = ''; }
  }

  /* PLAYER */
  function openPlayer(username) {
    const s = streamers.find(x => x.username === username);
    if (!s) return;
    currentPlayer = username;

    document.getElementById('main-view').classList.add('hidden');
    document.getElementById('player-view').classList.add('active');

    const iframe = document.getElementById('player-iframe');
    const blocked = document.getElementById('player-blocked');
    blocked.classList.remove('show');
    iframe.src = `https://player.kick.com/${username}?autoplay=true`;

    iframe.onload = null;
    const timer = setTimeout(() => {
      try {
        if (!iframe.contentDocument && !iframe.contentWindow?.location?.href) {
          showBlocked(username);
        }
      } catch(e) {}
    }, 4000);
    iframe.onerror = () => { clearTimeout(timer); showBlocked(username); };

    updatePlayerMeta(username);
    renderSidebar();
    loadMarketLayout(username);
    window.scrollTo(0, 0);
  }

  function showBlocked(username) {
    const blocked = document.getElementById('player-blocked');
    document.getElementById('blocked-link').href = KICK + username;
    blocked.classList.add('show');
  }

  function updatePlayerMeta(username) {
    const s = streamers.find(x => x.username === username);
    const d = data[username];
    const name = d?.displayName || s?.display || username;
    document.getElementById('player-name').textContent = name;
    document.getElementById('player-kick-link').href = KICK + username;
    document.getElementById('player-title').textContent = d?.title || '';
    document.getElementById('player-category').textContent = d?.category || '';
    const liveBadge = document.getElementById('player-live-badge');
    const viewersEl = document.getElementById('player-viewers');
    if (d?.isLive) {
      liveBadge.style.display = 'inline-block';
      viewersEl.style.display = 'flex';
      document.getElementById('player-viewers-count').textContent = fv(d.viewers);
    } else {
      liveBadge.style.display = 'none';
      viewersEl.style.display = 'none';
    }
  }

  function goHome() {
    currentPlayer = null;
    document.getElementById('player-iframe').src = '';
    document.getElementById('main-view').classList.remove('hidden');
    document.getElementById('player-view').classList.remove('active');
    renderSidebar();
  }

  /* FILTER / SEARCH */
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }
  function handleSearch() { searchQ = document.getElementById('search-input').value.toLowerCase().trim(); render(); }

  /* TOAST */
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

  /* INIT */
  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
</html>
